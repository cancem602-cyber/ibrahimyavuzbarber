<head>

<title>İbrahim Yavuz Barber | IBAN</title>
<style>
  :root { --green:#1E7D50; --ink:#111; --muted:#6a6f6c; --line:#e2e6e3; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#fbfbf9; color:var(--ink); font-family:Poppins,Arial,Helvetica,sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:34px 24px; position:relative; overflow:hidden; }
  .pole { position:absolute; left:0; right:0; height:12px; background:repeating-linear-gradient(-45deg,var(--green) 0 10px,#fff 10px 20px,#111 20px 30px,#fff 30px 40px); }
  .pole.top { top:0; } .pole.bot { bottom:0; }
  .blob { position:absolute; border-radius:50%; pointer-events:none; }
  .b1 { width:300px; height:300px; top:-130px; left:-130px; background:rgba(30,125,80,.10); }
  .b2 { width:340px; height:340px; bottom:-160px; right:-150px; background:rgba(17,17,17,.07); }
  .b1::after,.b2::after { content:""; position:absolute; inset:26px; border-radius:50%; border:1px solid rgba(30,125,80,.35); }
  main { position:relative; z-index:1; width:100%; max-width:420px; text-align:center; }
  .logo { width:78%; display:block; margin:0 auto 4px; }
  .divider { display:flex; align-items:center; gap:14px; margin:10px 0 20px; color:var(--green); }
  .divider::before,.divider::after { content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,#111); }
  .divider::after { background:linear-gradient(270deg,transparent,#111); }
  .divider svg { width:64px; height:auto; }
  h1 { font-size:13px; font-weight:600; letter-spacing:7px; text-transform:uppercase; margin:0 0 18px; color:var(--green); }
  .card { background:#fff; border:2px solid #111; border-radius:22px; padding:24px 20px; text-align:left; box-shadow:6px 6px 0 var(--green); }
  .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:2px; margin:0 0 4px; }
  .value { font-size:17px; font-weight:700; margin:0 0 16px; padding-bottom:16px; border-bottom:1px solid var(--line); }
  .iban { font-size:19px; font-weight:700; letter-spacing:1.5px; word-break:break-word; margin:0; color:var(--green); }
  button { width:100%; margin-top:22px; padding:16px; border:0; border-radius:999px; background:#111; color:#fff; font-size:16px; font-weight:700; letter-spacing:.5px; font-family:inherit; cursor:pointer; }
  button:active { transform:scale(.98); }
  .note { font-size:13px; color:var(--muted); margin-top:18px; }
  .brand { margin-top:16px; font-size:10px; letter-spacing:6px; color:#8a908d; text-transform:uppercase; }
</style>
</head>
